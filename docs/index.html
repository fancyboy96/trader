<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trader — Portfolio Research</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root, [data-theme="light"] {
      --bg: #FFFFFF; --bg-card: #F4F6FA; --border: #D6DCE8;
      --accent: #2558C4; --text: #0C1A36; --text-dim: #6B7FA0;
    }
    [data-theme="dark"] {
      --bg: #0A1220; --bg-card: #0D1729; --border: #1E2D45;
      --accent: #F2BDCC; --text: #F0F4F8; --text-dim: #7A9AB8;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 15px; line-height: 1.65;
      padding: 40px 32px; max-width: 1100px; margin: 0 auto;
    }
    .label { color: var(--accent); font-size: 12px; letter-spacing: .15em; text-transform: uppercase; margin-bottom: 6px; }
    h1 { font-size: 24px; font-weight: normal; margin-bottom: 8px; }
    .meta { color: var(--text-dim); font-size: 13px; margin-top: 24px; }
    .theme-toggle {
      background: transparent; border: 1px solid var(--border); border-radius: 4px;
      color: var(--text-dim); font-family: inherit; font-size: 10px; font-weight: 600;
      letter-spacing: .08em; text-transform: uppercase; padding: 4px 10px; cursor: pointer;
    }
    header { display: flex; justify-content: space-between; align-items: flex-start;
             border-bottom: 1px solid var(--accent); padding-bottom: 20px; margin-bottom: 36px; }
  </style>
</head>
<body>
<header>
  <div>
    <div class="label">Trader — Portfolio Research</div>
    <h1>Stock Analysis Dashboard</h1>
  </div>
  <button class="theme-toggle" onclick="toggleTheme()">Dark</button>
</header>
<p class="meta">Site under construction. Reports and company profiles will appear here as analysis is completed.</p>
<script>
  function toggleTheme() {
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    document.querySelector('.theme-toggle').textContent = next === 'dark' ? 'Light' : 'Dark';
  }
</script>
</body>
</html>
